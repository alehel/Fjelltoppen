name: Flaaklypa Grand Prix release
# Builds the stand-alone application for every platform with the scripts in
# dists/flaaklypa, and publishes a release with the packages for a tag on
# the flaaklypa branch. The tag is the version: v0.2.0, or v0.2.0-beta1 for
# a pre-release. Run by hand, it only builds.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Tag on the flaaklypa branch
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...flaaklypa" --jq .status)
          if [ "$status" != identical ] && [ "$status" != ahead ]; then
            echo "::error::$GITHUB_REF_NAME is not on the flaaklypa branch"
            exit 1
          fi
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
  macos:
    name: macOS
    needs: check
    runs-on: macos-15
    env:
      FLAAKLYPA_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build
        run: dists/flaaklypa/macos/build.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/*.dmg
          if-no-files-found: error
  windows:
    name: Windows
    needs: check
    runs-on: ubuntu-24.04
    env:
      FLAAKLYPA_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t flaaklypa-windows dists/flaaklypa/windows
          docker run --rm -e FLAAKLYPA_VERSION -v "$PWD:/src:ro" -v "$PWD/build:/build" \
            flaaklypa-windows /src/dists/flaaklypa/windows/build.sh /build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/*.zip
          if-no-files-found: error
  linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      FLAAKLYPA_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t flaaklypa-linux dists/flaaklypa/linux
          docker run --rm -e FLAAKLYPA_VERSION -v "$PWD:/src:ro" -v "$PWD/build:/build" \
            flaaklypa-linux /src/dists/flaaklypa/linux/build.sh /build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: build/*.AppImage
          if-no-files-found: error
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dists/flaaklypa
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
            --title "Flåklypa Grand Prix $VERSION" --notes-file dists/flaaklypa/release-notes.md packages/*
