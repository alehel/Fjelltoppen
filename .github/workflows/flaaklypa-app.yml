name: Flaaklypa Grand Prix app
# Builds the stand-alone application with the scripts in dists/flaaklypa.
# Run it by hand, or push a tag like flaaklypa-v0.1.0 to also get a draft
# release with the packages.
on:
  workflow_dispatch:
  push:
    tags:
      - 'flaaklypa-v*'
permissions:
  contents: read
jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build
        run: dists/flaaklypa/macos/build.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/*.dmg
  windows:
    name: Windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t flaaklypa-windows dists/flaaklypa/windows
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build:/build" flaaklypa-windows /src/dists/flaaklypa/windows/build.sh /build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/*.zip
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t flaaklypa-linux dists/flaaklypa/linux
          docker run --rm -v "$PWD:/src:ro" -v "$PWD/build:/build" flaaklypa-linux /src/dists/flaaklypa/linux/build.sh /build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: build/*.AppImage
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Flåklypa Grand Prix ${GITHUB_REF_NAME#flaaklypa-v}" packages/*
