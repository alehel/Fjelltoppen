name: Fjelltoppen release
# Builds Fjelltoppen, the stand-alone Flaaklypa Grand Prix runner, for every
# platform with the scripts in dists/fjelltoppen, and publishes a release
# with the packages for a tag on the flaaklypa branch. The tag is the
# version: v0.2.0, or v0.2.0-beta1 for a pre-release. A release published
# by hand on GitHub (which pushes its tag) keeps its title and text and gets
# the packages added. Run by hand, it only builds.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Tag on the flaaklypa branch
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$GITHUB_SHA...flaaklypa" --jq .status)
          if [ "$status" != identical ] && [ "$status" != ahead ]; then
            echo "::error::$GITHUB_REF_NAME is not on the flaaklypa branch"
            exit 1
          fi
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi
  macos:
    name: macOS
    needs: check
    runs-on: macos-15
    env:
      FJELLTOPPEN_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rosetta
        run: sudo softwareupdate --install-rosetta --agree-to-license
      - name: Build
        run: dists/fjelltoppen/macos/build.sh build
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: build/*.dmg
          if-no-files-found: error
  windows:
    name: Windows
    needs: check
    runs-on: ubuntu-24.04
    env:
      FJELLTOPPEN_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t fjelltoppen-windows dists/fjelltoppen/windows
          docker run --rm -e FJELLTOPPEN_VERSION -v "$PWD:/src:ro" -v "$PWD/build:/build" \
            fjelltoppen-windows /src/dists/fjelltoppen/windows/build.sh /build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/*.zip
          if-no-files-found: error
  linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    env:
      FJELLTOPPEN_VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t fjelltoppen-linux dists/fjelltoppen/linux
          docker run --rm -e FJELLTOPPEN_VERSION -v "$PWD:/src:ro" -v "$PWD/build:/build" \
            fjelltoppen-linux /src/dists/fjelltoppen/linux/build.sh /build
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: build/*.AppImage
          if-no-files-found: error
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check, macos, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: dists/fjelltoppen
      - uses: actions/download-artifact@v4
        with:
          path: packages
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber packages/*
            exit
          fi
          prerelease=
          case "$VERSION" in *-*) prerelease=--prerelease ;; esac
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
            --title "Fjelltoppen $VERSION" --notes-file dists/fjelltoppen/release-notes.md packages/*
